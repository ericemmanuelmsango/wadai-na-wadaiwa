<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E.E.MSANGO POS — Mauzo</title>
<meta name="theme-color" content="#0e2a3f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EE POS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e2a3f; --navy2:#16405c; --teal:#14a37f; --teal-d:#0e7f63; --amber:#f0a92e; --red:#d64545;
  --bg:#eef2f5; --card:#ffffff; --ink:#15212b; --mute:#6c7a86; --line:#dde4ea; --chip:#e5edf2;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border-radius:16px;padding:26px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;margin-bottom:6px}
.logo .mk{background:var(--teal);color:#fff;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:none;overflow:hidden}
.logo .mk img,.logo .mk svg{width:100%;height:100%;object-fit:contain}
.users{display:grid;gap:8px;margin:16px 0;max-height:42vh;overflow:auto}
.user-btn{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font-size:14px;font-weight:600;text-align:left}
.user-btn.on{border-color:var(--teal);background:rgba(20,163,127,.08)}
.user-btn small{color:var(--mute);font-weight:500}
.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.field.sm{padding:7px 9px;font-size:13px}
label.l{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:10px 0 4px}
.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn-p{background:var(--teal);color:#fff}.btn-p:hover{background:var(--teal-d)}
.btn-g{background:var(--chip);color:var(--ink)}
.btn-r{background:var(--red);color:#fff}
.btn-a{background:var(--amber);color:#2a1b00}
.hint{font-size:12px;color:var(--mute);margin-top:10px;line-height:1.5}
.err{color:var(--red);font-size:12.5px;margin-top:8px}
.ok{color:var(--teal);font-size:12.5px;margin-top:8px}
/* app shell */
.top{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px;position:sticky;top:0;z-index:5}
.top .logo{font-size:15px;margin:0;min-width:0}.top .logo .mk{width:32px;height:32px;font-size:16px;background:#fff}
.top .logo .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:12.5px;display:flex;align-items:center;gap:6px;flex:none}
.who b{background:var(--navy2);padding:5px 10px;border-radius:20px;white-space:nowrap}
.who button{background:transparent;color:#cfe0ea;border:1px solid #3d6680;border-radius:8px;padding:5px 9px;font-size:12px;white-space:nowrap}
.sync{font-size:11.5px;color:#cfe0ea;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--navy2);padding:6px;overflow-x:auto;position:sticky;top:52px;z-index:4}
.tab{background:transparent;color:#cfe0ea;border:0;padding:8px 13px;border-radius:8px;font-weight:700;font-size:13px;white-space:nowrap}
.tab.on{background:#fff;color:var(--navy)}
main{padding:14px;max-width:1400px;margin:0 auto}
.banner{background:rgba(214,69,69,.1);border:1px solid rgba(214,69,69,.35);color:var(--ink);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.banner pre{background:#fff;color:#111;padding:8px;border-radius:6px;overflow-x:auto;font-size:11px}
/* POS */
.pos{display:grid;grid-template-columns:1fr 400px;gap:14px;align-items:start}
@media(max-width:900px){.pos{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--line)}
.panel+.panel{margin-top:14px}
.mode{display:flex;background:var(--chip);border-radius:10px;padding:4px;margin-bottom:10px;gap:4px}
.mode button{flex:1;border:0;background:transparent;color:var(--ink);padding:9px;border-radius:8px;font-weight:800}
.mode button.on{background:var(--navy);color:#fff}
.mode button.on.whole{background:var(--amber);color:#2a1b00}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:2px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:7px 12px;border-radius:20px;font-weight:600;font-size:12.5px;white-space:nowrap}
.chip.on{background:var(--teal);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:64vh;overflow:auto;padding:2px}
.prod{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:3px;min-height:92px}
.prod:hover:not(:disabled){border-color:var(--teal)}
.prod .nm{font-weight:700;font-size:12.5px;line-height:1.25}
.prod .ct{font-size:10.5px;color:var(--mute)}
.prod .pr{font-weight:800;color:var(--teal);margin-top:auto}
.prod .st{font-size:11px;color:var(--mute)}
.prod .st.low{color:var(--red);font-weight:700}
.cart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.cart-list{max-height:36vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;padding:8px;border-radius:9px;background:var(--bg)}
.line .n{font-weight:700;font-size:12.5px}
.line .s{font-size:11.5px;color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.line .s input{width:96px}
.line .chgd{color:var(--amber);font-weight:700}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border:0;border-radius:7px;background:var(--chip);color:var(--ink);font-weight:800}
.qty input{width:44px;text-align:center;padding:5px 2px}
.tot{font-weight:800;text-align:right}
.sum{border-top:2px dashed var(--line);margin-top:10px;padding-top:10px;display:grid;gap:8px}
.big{display:flex;justify-content:space-between;font-size:21px;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay{display:flex;gap:6px}
.pay button{flex:1;border:2px solid var(--line);background:transparent;color:var(--ink);padding:8px 4px;border-radius:9px;font-weight:700;font-size:12.5px}
.pay button.on{border-color:var(--teal);background:rgba(20,163,127,.1)}
.change{font-size:17px;font-weight:800;color:var(--teal)}
.change.neg{color:var(--red)}
.empty{color:var(--mute);text-align:center;padding:24px 8px;font-size:13px}
.cart-fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;border:0;border-radius:30px;padding:12px 16px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:6;display:none}
@media(max-width:900px){.cart-fab{display:block}}
/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;background:rgba(214,69,69,.12);color:var(--red);white-space:nowrap}
.badge.ok{background:rgba(20,163,127,.12);color:var(--teal)}
.badge.am{background:rgba(240,169,46,.2);color:#9a6400}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .l{font-size:12px;color:var(--mute);font-weight:600}
.stat .v{font-size:21px;font-weight:800;margin-top:4px}
.stat.g .v{color:var(--teal)}.stat.r .v{color:var(--red)}
.note{display:flex;align-items:center;gap:8px;background:rgba(240,169,46,.15);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.note.red{background:rgba(214,69,69,.1)}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:14.5px;margin:0 0 10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sale{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.sale-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);cursor:pointer;flex-wrap:wrap}
.sale-h .m{font-size:11.5px;color:var(--mute)}
.sale-b{padding:10px 12px}
.day{font-size:12px;font-weight:800;color:var(--mute);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.split{grid-template-columns:1fr}}
/* modal / receipt */
.ov{position:fixed;inset:0;background:rgba(8,20,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow:auto}
.rcpt{background:#fff;color:#111;width:100%;max-width:340px;border-radius:12px;padding:18px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;max-height:78vh;overflow:auto}
.rcpt.wide{max-width:760px;font-family:'Manrope',sans-serif}
.rcpt h3{text-align:center;margin:4px 0 0;font-family:'Manrope',sans-serif;font-size:15px}
.rcpt .c{text-align:center;color:#444;font-size:11.5px}
.rcpt .dl{border-top:1px dashed #999;margin:8px 0}
.rcpt .rr{display:flex;justify-content:space-between;gap:8px}
.rcpt .lg{display:flex;justify-content:center}
.rcpt .lg img,.rcpt .lg svg{width:54px;height:54px;object-fit:contain}
.rcpt table td,.rcpt table th{padding:5px 4px;color:#111;border-color:#ddd}
.ov-actions{display:flex;gap:8px;margin-top:12px}
.ov-actions .btn{flex:1}
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;top:0;left:0;width:100%;max-width:none!important;max-height:none!important;overflow:visible!important;box-shadow:none;border-radius:0}
  .no-print{display:none!important}
}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;z-index:30;max-width:90vw;text-align:center}
.loading{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mute)}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.act{font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.act .tm{color:var(--mute);white-space:nowrap;font-size:11.5px;min-width:120px}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.switch input{width:18px;height:18px}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spin"></div>Inapakia...</div></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="pos.js?v=1"></script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
