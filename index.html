<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E.E.MSANGO COMPANY LIMITED — Business System</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b1b30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E.E.MSANGO">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("ee_theme")||"light")}catch(e){}</script>
<style>
:root{
  --ink:#172033; --paper:#f3f6fa; --paper-alt:#eef2f7; --line:#dfe4ec;
  --green:#08b66c; --rust:#e2632b; --amber:#e8a317; --amber-soft:#fff1d7;
  --navy:#0b1b30; --blue:#1677ff;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,Helvetica,sans-serif;}
body{background:var(--paper);color:var(--ink);}
button{cursor:pointer;font-family:inherit;}
input{font-family:inherit;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:20px;}
.login-card{background:#fff;border-radius:14px;padding:32px 28px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;}
.login-mark{width:52px;height:52px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;}
.login-card h1{font-size:19px;}
.login-sub{font-size:12.5px;color:#718096;margin-bottom:6px;}
.login-error{color:#dc2636;font-size:12px;}
.field{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;background:#fff;color:var(--ink);}
.field:focus{outline:2px solid var(--blue);outline-offset:1px;}
.field-sm{padding:7px 9px;font-size:12.5px;}
.btn{border:none;border-radius:7px;font-size:13.5px;font-weight:600;padding:9px 14px;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:#14284a;}
.btn-ghost{background:none;color:#6b7280;}
.btn-ghost:hover{background:var(--paper-alt);}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn-block{width:100%;justify-content:center;}

/* SHELL */
.shell{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--navy);color:#fff;padding:22px 16px;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:30px;}
.logo-mark{width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
.logo h2{font-size:15px;}
.logo small{color:#9eabc0;font-size:11px;}
.menu{list-style:none;flex:1;}
.menu li{display:flex;align-items:center;gap:10px;padding:12px;margin:4px 0;border-radius:8px;cursor:pointer;color:#d5dce7;font-size:13.5px;position:relative;}
.menu li:hover,.menu li.active{background:var(--blue);color:#fff;}
.menu-badge{margin-left:auto;background:#ed3948;color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;}
.sidebar-bottom{color:#8997ab;font-size:11px;line-height:1.5;}
.main{flex:1;margin-left:220px;min-width:0;}
.topbar{height:68px;background:#0d2038;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10;}
.search{display:flex;align-items:center;background:#203650;border-radius:22px;padding:9px 16px;width:300px;color:#b9c5d5;font-size:13px;}
.search input{background:none;border:none;outline:none;color:#fff;font-size:13px;width:100%;}
.search input::placeholder{color:#8ea0ba;}
.profile{display:flex;align-items:center;gap:12px;font-size:12.5px;}
.bell-wrap{position:relative;background:none;border:none;color:#fff;cursor:pointer;font-size:18px;}
.bell-dot{position:absolute;top:-6px;right:-8px;background:#ed3948;color:#fff;font-size:9px;padding:1px 5px;border-radius:20px;}
.avatar{width:34px;height:34px;border-radius:50%;background:#e9eef5;}
.logout-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:7px 12px;border-radius:7px;font-size:12px;font-weight:600;margin-left:6px;}
.logout-btn:hover{background:rgba(255,255,255,.16);}
.content{padding:22px;}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.page-header h1{font-size:24px;}
.page-header p{color:#718096;margin-top:3px;font-size:13px;}
.date{background:#fff;padding:9px 14px;border-radius:8px;box-shadow:0 2px 8px #dce2ea;font-size:12.5px;}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;}
@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr);}}
@media(max-width:700px){.cards{grid-template-columns:1fr 1fr;}}
.stat-card{color:#fff;padding:18px;border-radius:10px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;}
.stat-card h4{font-size:12.5px;font-weight:600;opacity:.9;}
.stat-card h2{font-size:20px;margin:8px 0 4px;}
.stat-card p{font-size:11px;opacity:.85;}
.blue{background:var(--blue);} .green{background:var(--green);} .purple{background:#7c45e8;}
.orange{background:var(--rust);} .red{background:#ed3948;} .cyan{background:#119ebd;}

/* reminders */
.reminder-bar{background:var(--amber-soft);border:1px solid #f0d599;border-radius:10px;padding:14px 16px;margin:18px 0;}
.reminder-title{display:flex;align-items:center;gap:7px;font-weight:700;color:#b8862f;font-size:14px;margin-bottom:8px;}
.reminder-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;}
.reminder-group-label{font-size:12.5px;font-weight:600;margin-right:2px;}
.reminder-group-label.green{color:var(--green);} .reminder-group-label.rust{color:var(--rust);}
.reminder-chip{font-size:12px;padding:3px 9px;border-radius:20px;background:#fff;border:1px solid var(--line);}
.reminder-chip.overdue{border-color:var(--rust);color:var(--rust);}
.reminder-chip.today{border-color:#b8862f;color:#b8862f;}

/* panels/charts */
.lower{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:16px;}
@media(max-width:900px){.lower{grid-template-columns:1fr;}}
.panel{background:#fff;padding:18px;border-radius:10px;box-shadow:0 2px 8px #e1e6ed;}
.panel h3{font-size:15px;margin-bottom:14px;}
.chart-container{height:230px;position:relative;}
.recent-table{width:100%;border-collapse:collapse;}
.recent-table td{padding:10px 6px;border-top:1px solid #edf0f4;font-size:12.5px;}
.rt-amount{font-weight:600;text-align:right;} .rt-date{color:#8290a4;font-size:11.5px;text-align:right;}
.badge{padding:3px 9px;border-radius:15px;font-size:10.5px;font-weight:600;}
.badge.pending{background:#fff1d7;color:#e28b00;} .badge.paid{background:#dff8e9;color:#0b9c55;}

/* alerts page */
.alert{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #edf0f4;}
.alert:last-child{border-bottom:none;}
.alert-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#edf2f7;color:#65748b;flex-shrink:0;font-size:16px;}
.alert-icon.overdue{background:#ffe0e3;color:#dc2636;} .alert-icon.today{background:var(--amber-soft);color:#b8862f;}
.alert-body{flex:1;min-width:0;} .alert-body strong{font-size:13px;display:block;}
.alert-body small{display:block;color:#8290a4;margin-top:3px;}
.alert-dir{flex-shrink:0;font-size:18px;} .alert-dir.green{color:var(--green);} .alert-dir.rust{color:var(--rust);}

.rank-row{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid #edf0f4;font-size:13px;}
.rank-row:last-child{border-bottom:none;}
.rank-amt{font-weight:700;} .rank-amt.green{color:var(--green);} .rank-amt.rust{color:var(--rust);}

/* users */
.user-list{display:flex;flex-direction:column;gap:8px;}
.user-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--paper-alt);border-radius:8px;}
.user-row-main{display:flex;flex-direction:column;gap:2px;}
.user-name{font-size:13.5px;font-weight:600;} .user-detail{font-size:11.5px;color:#8290a4;}
.settings-panel{max-width:380px;display:flex;flex-direction:column;gap:10px;}
.settings-msg{font-size:12.5px;} .settings-msg.ok{color:#0b9c55;} .settings-msg.err{color:#dc2636;}

/* ledger columns */
.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.columns.single{grid-template-columns:1fr;max-width:none;width:100%;}
/* Debtors / Creditors: cards fill the whole screen like the Sales page */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start;}
.card-grid .card.expanded{grid-column:1/-1;}
@media(max-width:680px){.card-grid{grid-template-columns:1fr;}}
@media(max-width:680px){.columns{grid-template-columns:1fr;}}
.column{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;}
.column-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;margin-bottom:14px;border-bottom:2px solid var(--line);}
.column.green .column-header{border-bottom-color:var(--green);} .column.rust .column-header{border-bottom-color:var(--rust);}
.column-header h2{font-size:17px;font-weight:700;} .column-sub{font-size:12.5px;color:#8290a4;margin-top:2px;}
.column-total{text-align:right;} .column-total-label{display:block;font-size:11px;color:#8290a4;}
.column-total-val{display:block;font-size:16px;font-weight:700;}
.column.green .column-total-val{color:var(--green);} .column.rust .column-total-val{color:var(--rust);}
.column-list{display:flex;flex-direction:column;gap:10px;min-height:40px;}
.empty-note{color:#a3aebe;font-size:13px;text-align:center;padding:20px 0;}

.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper);}
.card.cleared{opacity:.6;}
.card-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:none;border:none;text-align:left;color:inherit;}
.card-head-main{display:flex;flex-direction:column;gap:3px;}
.card-name{font-weight:600;font-size:14px;}
.card-meta-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.card-phone{font-size:12px;color:#8290a4;}
.due-badge{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);}
.due-badge.today{color:#b8862f;border-color:#b8862f;} .due-badge.overdue{color:var(--rust);border-color:var(--rust);}
.card-head-right{display:flex;align-items:center;gap:8px;}
.card-balance{font-weight:700;font-size:14px;}
.card.green .card-balance{color:var(--green);} .card.rust .card-balance{color:var(--rust);}
.card.cleared .card-balance{color:#8290a4;font-weight:600;font-size:12.5px;}
.card-body{padding:0 14px 14px;border-top:1px solid var(--line);}
.card-note{font-size:12.5px;color:#6b7280;margin-top:10px;font-style:italic;}
.items-summary{margin:10px 0 6px;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.items-summary-row{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;font-size:12.5px;border-bottom:1px solid var(--line);background:#fff;}
.items-summary-row:last-child{border-bottom:none;}
.isr-detail{color:#8290a4;} .isr-total{font-weight:600;}
.receipt-link-btn{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--green);font-size:12px;font-weight:600;padding:2px 0 8px;}
.card-stats{display:flex;gap:16px;margin:12px 0;flex-wrap:wrap;}
.stat-label{display:block;font-size:10.5px;color:#8290a4;} .stat-val{display:block;font-size:13.5px;font-weight:600;}
.stat-val.strong{color:var(--rust);}
.payment-history{display:flex;flex-direction:column;gap:4px;margin:10px 0;padding:8px 10px;background:var(--paper-alt);border-radius:6px;}
.payment-row{display:flex;align-items:center;gap:6px;font-size:12px;color:#6b7280;}
.payment-amt{margin-left:auto;color:var(--green);font-weight:600;}
.pay-row{display:flex;gap:8px;margin-top:10px;}
.archive-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--paper-alt);color:#6b7280;font-size:12.5px;font-weight:600;}
.archive-btn:hover{background:#e5e9ef;color:var(--ink);}
.history-toggle{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:none;color:#8290a4;font-size:12px;font-weight:600;padding:6px;width:100%;}
.history-toggle:hover{color:var(--ink);}
.history-list{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line);}
.history-row{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--paper-alt);border-radius:7px;}
.history-name{font-size:12.5px;font-weight:600;} .history-detail{font-size:11px;color:#8290a4;}
.icon-btn{background:none;border:none;color:var(--rust);padding:8px;font-size:16px;min-width:32px;min-height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
.icon-btn.restore{color:var(--green);}
.add-btn{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border:1px dashed var(--line);border-radius:8px;background:none;color:#6b7280;font-size:13.5px;font-weight:600;width:100%;}
.add-btn:hover{background:var(--paper-alt);color:var(--ink);}

/* entry form */
.entry-form{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:10px;background:#fff;}
.mode-toggle{display:flex;gap:6px;margin-bottom:4px;}
.mode-btn{flex:1;padding:7px;border-radius:7px;border:1px solid var(--line);background:var(--paper-alt);color:#6b7280;font-size:12.5px;font-weight:600;}
.mode-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
/* vibox (tiles) vya bidhaa + picha */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;align-content:start;grid-auto-rows:max-content}
@media(max-width:520px){.tile-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.tile-card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--paper,#fff);overflow:hidden;min-width:0}
.tc-body{padding:9px 10px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tc-name{font-weight:700;font-size:12.5px;line-height:1.25;word-break:break-word}
.tc-price{font-weight:800;color:#14a37f;font-size:14px}
.tc-qty{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tc-qty small{font-weight:600;font-size:11px;color:#8290a4}
.tc-sub{font-size:11.5px;color:#6b7280}.tc-row{font-size:12px}
.tc-actions{display:flex;gap:4px;margin-top:2px}
.ph-box{display:block;width:100%;aspect-ratio:16/10;background:#eef2f7;overflow:hidden;border:0;padding:0}
.ph-box img{width:100%;height:100%;object-fit:cover;display:block}
button.ph-box{cursor:pointer}
.ph-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:22px;color:#94a3b8;cursor:pointer;font-family:inherit}
.ph-empty span{font-size:11px;font-weight:600}
.ph-empty:hover{background:#e2e8f0;color:#475569}
.pick-tile .pk-ph{width:100%;aspect-ratio:4/3;border-radius:8px;overflow:hidden;margin-bottom:4px;background:#eef2f7}
.pick-tile .pk-ph img{width:100%;height:100%;object-fit:cover;display:block}
.pt-prev{margin-top:10px;aspect-ratio:4/3;border-radius:10px;background:#eef2f7;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;color:#94a3b8;font-size:13px}
.pt-prev img{width:100%;height:100%;object-fit:cover}
.pt-tag{position:absolute;left:8px;top:8px;background:rgba(15,23,42,.7);color:#fff;font-size:11px;padding:2px 8px;border-radius:20px}
.photo-fab{display:inline-flex;align-items:center;gap:6px}
.mini-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0e2a3f;color:#fff;padding:10px 18px;border-radius:24px;font-weight:700;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.2)}
/* Record a Sale: bidhaa kama vibox (tiles) */
.pick-box{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.pick-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;min-width:0}
.pick-chips .chip-btn{white-space:nowrap}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:340px;overflow:auto;padding:2px;align-content:start;grid-auto-rows:max-content}
@media(max-width:520px){.pick-grid{grid-template-columns:repeat(2,1fr)}}
.pick-tile{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--paper,#fff);color:var(--ink,#172033);cursor:pointer;font:inherit;min-height:88px}
.pick-tile:hover:not(:disabled){border-color:#14a37f}
.pick-tile:active:not(:disabled){transform:scale(.98)}
.pick-tile.on{border-color:#14a37f;box-shadow:0 0 0 2px rgba(20,163,127,.25)}
.pick-tile.out{opacity:.5;cursor:not-allowed}
.pick-tile .pk-name{font-weight:700;font-size:12.5px;line-height:1.25;padding-right:34px}
.pick-tile .pk-cat{font-size:10.5px;color:#8290a4}
.pick-tile .pk-price{font-weight:800;color:#14a37f;margin-top:auto}
.pick-tile .pk-qty{font-size:11px;color:#8290a4}
.pick-tile .pk-qty.low{color:#dc2636;font-weight:700}
.pick-tile .pk-n{position:absolute;top:6px;right:6px;background:#14a37f;color:#fff;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:20px}
.pick-more{grid-column:1/-1;font-size:12px;color:#8290a4;text-align:center;padding:6px}
.items-block{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper-alt);display:flex;flex-direction:column;gap:6px;}
.discount-mode-toggle{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#6b7280;margin-bottom:2px;}
.chip-btn{padding:3px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:11px;font-weight:600;color:#6b7280;}
.chip-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.item-row{display:grid;grid-template-columns:1.4fr .8fr .9fr .6fr .9fr auto;gap:6px;align-items:center;}
.item-row-head{font-size:10.5px;color:#8290a4;padding:0 2px;}
.item-line-total{font-size:12.5px;font-weight:600;text-align:right;}
.add-row-btn{display:flex;align-items:center;gap:5px;align-self:flex-start;background:none;border:none;color:var(--green);font-size:12.5px;font-weight:600;padding:4px 0;}
.grand-total-row{display:flex;justify-content:space-between;padding-top:6px;border-top:1px solid var(--line);font-size:13px;font-weight:700;}
.due-label{display:flex;align-items:center;gap:6px;font-size:12px;color:#6b7280;margin-top:2px;}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}

.err-banner{display:flex;justify-content:space-between;align-items:center;background:#ffe0e3;color:#dc2636;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px;}
.err-banner button{background:none;border:none;color:inherit;}

/* receipt modal */
.modal-overlay{position:fixed;inset:0;background:rgba(11,27,48,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-stack{display:flex;flex-direction:column;gap:10px;max-width:460px;width:100%;}
.receipt-print{background:#fff;border-radius:10px;padding:24px;max-height:70vh;overflow:auto;}
.receipt-title{font-size:20px;margin-bottom:12px;}
.receipt-meta{font-size:12.5px;color:#6b7280;margin-bottom:14px;display:flex;flex-direction:column;gap:3px;}
.receipt-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.receipt-table th{text-align:left;font-size:10.5px;color:#8290a4;font-weight:600;padding:5px 6px;border-bottom:1px solid var(--line);}
.receipt-table td{padding:6px;border-bottom:1px solid var(--line);}
/* risiti ya mtindo wa POS */
.receipt-print.rcp{max-width:340px;margin:0 auto;padding:18px;color:#111;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.45}
.rcp h3{text-align:center;margin:4px 0 0;font-family:inherit;font-size:15px;font-weight:800}
.rcp .c{text-align:center;color:#444;font-size:11.5px}.rcp .c.b{font-weight:700}
.rcp .dl{border-top:1px dashed #999;margin:8px 0}.rcp .rr{display:flex;justify-content:space-between;gap:8px}.rcp .rr.big{font-weight:800;font-size:14px}
.rcp-lg{display:flex;justify-content:center}
.rcp,.rcp *{font-family:ui-monospace,Menlo,Consolas,"Liberation Mono",monospace!important}
.rcp table.ri{width:100%;border-collapse:collapse;font-size:12px;margin:2px 0}
.rcp table.ri th{font-weight:700;border-bottom:1px solid #999;padding:3px 2px;text-align:left;color:#111;font-size:11.5px}
.rcp table.ri td{padding:4px 2px;border:0;vertical-align:top}
.rcp table.ri .q{text-align:center;width:11%}.rcp table.ri .n{text-align:right;white-space:nowrap;width:22%;padding-left:8px}
.rcp .sub{font-size:10.5px;color:#555}
.receipt-total-row{display:flex;justify-content:space-between;font-weight:700;font-size:14px;padding-top:10px;margin-top:4px;}
.modal-actions{display:flex;justify-content:center;gap:8px;}
@media print{
  @page{margin:5mm}
  html,body{height:auto!important;min-height:0!important;overflow:visible!important;background:#fff!important}
  /* Print only the copy of the receipt in #print-root; hide the whole page behind it */
  body.printing>*:not(#print-root){display:none!important}
  body.printing #print-root{display:block!important}
  #print-root .receipt-print{position:static!important;width:100%;max-width:none!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border-radius:0!important;margin:0!important}
  
  #print-root tr{break-inside:avoid}
  #print-root thead{display:table-header-group}
  /* fallback for browsers without beforeprint */
  body:not(.printing) *{visibility:hidden}
  body:not(.printing) .receipt-print,body:not(.printing) .receipt-print *{visibility:visible}
  body:not(.printing) .receipt-print{position:absolute;top:0;left:0;width:100%;max-height:none!important;overflow:visible!important;box-shadow:none}
  .no-print{display:none!important}
}
#print-root{display:none}
@media(max-width:800px){
  .sidebar{width:70px;}
  .sidebar .logo h2,.sidebar .logo small,.menu li span,.sidebar-bottom{display:none;}
  .main{margin-left:70px;}
  .search{width:150px;}
}

/* ===== DARK MODE (toggle 🌙/☀️ in the top bar; choice saved on this device) ===== */
html[data-theme="dark"]{--ink:#e6edf3;--paper:#0f1a24;--paper-alt:#16232f;--line:#26384a;--amber-soft:#3a2e14;color-scheme:dark;}
html[data-theme="dark"] body{background:var(--paper);color:var(--ink);}
html[data-theme="dark"] .login-card,html[data-theme="dark"] .panel,html[data-theme="dark"] .column,html[data-theme="dark"] .date,
html[data-theme="dark"] .entry-form,html[data-theme="dark"] .items-summary-row,html[data-theme="dark"] .reminder-chip,
html[data-theme="dark"] .chip-btn,html[data-theme="dark"] .field,html[data-theme="dark"] [style*="background:#fff"]{background:#16232f!important;color:var(--ink);box-shadow:none!important;}
html[data-theme="dark"] .chip-btn.active,html[data-theme="dark"] .mode-btn.active{background:#2a5a8a!important;color:#fff;}
html[data-theme="dark"] .card{background:#132029;}
html[data-theme="dark"] .reminder-bar{border-color:#5a4a1e;}
html[data-theme="dark"] .recent-table td,html[data-theme="dark"] .alert,html[data-theme="dark"] .rank-row,html[data-theme="dark"] td,html[data-theme="dark"] th{border-color:var(--line)!important;}
html[data-theme="dark"] .alert-icon,html[data-theme="dark"] .avatar{background:#1d2c3a;}
html[data-theme="dark"] .btn-ghost{color:#aab7c4;}
html[data-theme="dark"] .archive-btn:hover{background:#1d2c3a;}
html[data-theme="dark"] .badge.pending{background:#3a2e14;}
html[data-theme="dark"] .err-banner{background:#3a1a1e;}
html[data-theme="dark"] .modal-overlay{background:rgba(0,0,0,.7);}
html[data-theme="dark"] input[type=date]{color-scheme:dark;}
/* receipts / printouts stay paper-white */
html[data-theme="dark"] .receipt-print{--ink:#172033;--line:#dfe4ec;--paper:#f3f6fa;--paper-alt:#eef2f7;background:#fff!important;color:#172033;}
html[data-theme="dark"] .receipt-print .field,html[data-theme="dark"] .receipt-print [style*="background:#fff"]{background:#fff!important;color:#172033;}

/* ===== DASHBOARD (kituo cha biashara) ===== */
.db{--dbp:#ffffff;--dbp2:#f7f9fc;--dbl:#e6eaf0;--dbl2:#eef1f5;--dbm:#64748b;--dbi:#0b1220;--dba:#0b1b30;--dbacc:#1677ff;--dbg:#0e9f5b;--dbgs:#e7f6ee;--dbr:#d9480f;--dbrs:#fdeee8;--dbw:#b7791f;--dbws:#fdf3e1;--dbb1:#b9d4ff;--dbb2:#1677ff;
  display:grid;gap:16px;font-feature-settings:"tnum"}
html[data-theme="dark"] .db{--dbp:#121e2a;--dbp2:#16232f;--dbl:#22344a;--dbl2:#1b2a3a;--dbm:#93a3b8;--dbi:#e6edf3;--dba:#e6edf3;--dbacc:#5b9dff;--dbg:#34d399;--dbgs:#0f2a21;--dbr:#fb7d4a;--dbrs:#2e1a12;--dbw:#f6c453;--dbws:#2c2410;--dbb1:#1e3a63;--dbb2:#5b9dff}
.db-hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.db-hero h1{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--dbi)}
.db-hero p{color:var(--dbm);font-size:13.5px;margin-top:2px}
.db-actions{display:flex;gap:8px;flex-wrap:wrap}
.db-btn{border:1px solid var(--dbl);background:var(--dbp)!important;color:var(--dbi);font-weight:600;font-size:13px;border-radius:10px;padding:9px 13px;min-height:40px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.db-btn:hover{border-color:var(--dbm)}
.db-btn.pri{background:var(--dba)!important;color:#fff;border-color:var(--dba)}
html[data-theme="dark"] .db-btn.pri{background:var(--dbacc)!important;border-color:var(--dbacc);color:#04121f}
.db-btn:focus-visible,.db-link:focus-visible,.db-lock:focus-visible,.db-wa:focus-visible{outline:2px solid var(--dbacc);outline-offset:2px}
.db-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media(max-width:1000px){.db-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.db-card{background:var(--dbp)!important;border:1px solid var(--dbl);border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.05)!important;min-width:0;color:var(--dbi)}
.db-kpi{position:relative;overflow:hidden;display:grid;gap:4px;padding:16px 18px 14px}
.db-kl{font-size:12.5px;color:var(--dbm);font-weight:600}
.db-kv{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.2;color:var(--dbi)}
.db-kv small{font-size:13px;font-weight:600;color:var(--dbm);margin-right:4px;letter-spacing:0}
.db-kf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--dbm);padding-right:96px}
.db-kpi.acc .db-spark{color:var(--dbacc)}
.db-spark{position:absolute;right:14px;bottom:12px;width:96px;height:32px;color:var(--dbacc)}
@media(max-width:480px){.db-kv{font-size:20px}.db-spark{display:none}.db-kf{padding-right:0}}
.db-delta{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:11.5px;padding:1px 7px;border-radius:99px}
.db-delta.up{color:var(--dbg);background:var(--dbgs)}.db-delta.dn{color:var(--dbr);background:var(--dbrs)}.db-delta.eq{color:var(--dbm);background:var(--dbp2)}
.db-lock{border:1px dashed var(--dbl);background:var(--dbp2)!important;color:var(--dbm);font-size:12px;font-weight:600;border-radius:8px;padding:4px 9px}
.db-row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.db-span8{grid-column:span 8}.db-span4{grid-column:span 4}.db-span6{grid-column:span 6}
@media(max-width:1000px){.db-span8,.db-span4,.db-span6{grid-column:span 12}}
.db-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.db-h h3{font-size:14px;font-weight:700;color:var(--dbi);letter-spacing:-.01em}
.db-link{background:none;border:0;color:var(--dbacc);font-weight:600;font-size:12.5px;padding:4px 2px}
.db-legend{display:flex;gap:12px;font-size:12px;color:var(--dbm)}
.db-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.db-legend .lg1{background:var(--dbb1)}.db-legend .lg2{background:var(--dbb2)}
.db-chart{width:100%;height:auto;display:block}
.db-chart .db-grid{stroke:var(--dbl2)}.db-chart .db-axis{font-size:11px;fill:var(--dbm);font-family:inherit}.db-chart .db-strong{fill:var(--dbi);font-weight:700}
.db-chart .db-bar{fill:var(--dbb1)}.db-chart .db-bar2{fill:var(--dbb2)}
.db-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.db-pair>div,.db-mini>div{background:var(--dbp2)!important;border:1px solid var(--dbl2);border-radius:10px;padding:10px 12px;display:grid;gap:1px}
.db-pair span,.db-mini span{font-size:11.5px;color:var(--dbm)}
.db-pair b{font-size:17px;font-weight:800;letter-spacing:-.02em}.db-pair small{font-size:11px;color:var(--dbm)}
.pos{color:var(--dbg)}.neg{color:var(--dbr)}
.db-split{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:12px 0 8px;gap:2px}
.db-split i{display:block;height:100%}.db-split i.pos{background:var(--dbg)}.db-split i.neg{background:var(--dbr)}
.db-net{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 10px;border-bottom:1px solid var(--dbl2);margin-bottom:10px}
.db-net span{font-size:12.5px;color:var(--dbm)}.db-net b{font-size:18px;font-weight:800}
.db-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.db-mini b{font-size:20px;font-weight:800;color:var(--dbi)}
.db-mini .bad b{color:var(--dbr)}.db-mini .warn b{color:var(--dbw)}
.db-list{display:grid}
.db-li,.db-rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--dbl2)}
.db-li:first-child,.db-rank:first-child{border-top:0}
.db-ln{flex:1;min-width:0}.db-ln b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dbi)}
.db-ln small{font-size:11.5px;color:var(--dbm)}
.db-amt{font-weight:700;font-size:13.5px;white-space:nowrap;text-align:right}.db-amt small{display:block;font-size:11px;color:var(--dbm);font-weight:500}
.db-tag{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.db-tag.bad{color:var(--dbr);background:var(--dbrs)}.db-tag.warn{color:var(--dbw);background:var(--dbws)}
.db-wa{font-size:11.5px;font-weight:700;color:#fff;background:#16a34a;border-radius:8px;padding:5px 9px;text-decoration:none;white-space:nowrap}
.db-ok{background:var(--dbgs)!important;color:var(--dbg);border-radius:10px;padding:12px 14px;font-size:13px;font-weight:600}
.db-ok.neutral{background:var(--dbp2)!important;color:var(--dbm)}
.db-n{width:24px;height:24px;border-radius:7px;background:var(--dbp2);border:1px solid var(--dbl2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--dbm);flex:none}
@media(max-width:600px){.topbar{padding:0 10px;gap:8px}.search{width:auto;flex:1;min-width:0;padding:8px 12px}.profile{gap:6px}.avatar{display:none}.logout-btn{padding:6px 8px;margin-left:0}}
@media(max-width:520px){.db-li{flex-wrap:wrap}.db-li .db-ln{flex-basis:100%}.db-hero h1{font-size:21px}}
.db-meter{height:6px;background:var(--dbp2);border-radius:99px;overflow:hidden;margin-top:5px}.db-meter i{display:block;height:100%;background:var(--dbacc);border-radius:99px}

<body>
<div id="app"></div>

<script src="app.js?v=66"></script>
<script>
/* PRINT FIX: copy the open receipt to #print-root just before printing, so only it prints, once */
(function () {
  var root = document.createElement("div"); root.id = "print-root";
  document.addEventListener("DOMContentLoaded", function () { document.body.appendChild(root); });
  window.addEventListener("beforeprint", function () {
    var all = document.querySelectorAll("body > :not(#print-root) .receipt-print");
    var area = all[all.length - 1];
    if (!area) return;
    root.innerHTML = "";
    root.appendChild(area.cloneNode(true));
    document.body.classList.add("printing");
  });
  window.addEventListener("afterprint", function () { document.body.classList.remove("printing"); root.innerHTML = ""; });
})();
</script>
</body>
</html>
